name: blender-build
on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Blender
        run: |
          BLENDER=blender-4.2.9-linux-x64
          curl -fsSL -o blender.tar.xz \
            "https://download.blender.org/release/Blender4.2/${BLENDER}.tar.xz"
          tar xf blender.tar.xz
          echo "$PWD/${BLENDER}" >> "$GITHUB_PATH"
      - run: blender --command extension validate
      - run: blender --command extension build --output-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: nitrog3d-${{ github.sha }}
          path: dist/*.zip
